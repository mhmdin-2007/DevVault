events {}

http {
    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name devvault.ir www.devvault.ir;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name devvault.ir www.devvault.ir;

        ssl_certificate /etc/letsencrypt/live/devvault.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devvault.ir/privkey.pem;

        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            alias /app/media/;
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}